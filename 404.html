<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | PrimeTurf</title>
<meta name="robots" content="noindex" />
<script>
  // /page/ -> /page (the site's real addresses have no trailing slash)
  (function () {
    var p = location.pathname;
    if (p.length > 1 && p.charAt(p.length - 1) === '/') location.replace(p.replace(/\/+$/, '') + location.search + location.hash);
  })();
</script>

  a{display:inline-block;background:#C9A44A;color:#0B3D2E;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:16px 28px;border-radius:2px;margin:4px}
